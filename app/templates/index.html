<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLMチューター</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>LLMチューターとの対話</h1>
    <div id="chat-box"></div>
    <form id="message-form">
        <input type="text" id="message-input" placeholder="メッセージを入力..." autocomplete="off">
        <button type="submit">送信</button>
    </form>

    <script>
        const chatBox = document.getElementById('chat-box');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        let sessionId = null;

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showLoading() {
            const wrap = document.createElement('div');
            wrap.id = 'loading-indicator';
            wrap.className = 'loading-indicator';
            wrap.innerHTML = '<div class="spinner"></div>';
            chatBox.appendChild(wrap);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function hideLoading() {
            const el = document.getElementById('loading-indicator');
            if (el) el.remove();
        }

        messageForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const userMessage = messageInput.value.trim();
            if (!userMessage) return;

            appendMessage(userMessage, 'user-message');
            messageInput.value = '';
            const submitBtn = messageForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            showLoading();

            try {
                const body = { message: userMessage };
                if (sessionId) body.session_id = sessionId;

                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                hideLoading();

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    appendMessage('エラー: ' + (errData.error || response.status), 'tutor-message');
                    return;
                }

                const data = await response.json();
                if (data.session_id) sessionId = data.session_id;
                if (data.response) {
                    appendMessage(data.response, 'tutor-message');
                } else if (data.error) {
                    appendMessage('エラー: ' + data.error, 'tutor-message');
                }
            } catch (e) {
                hideLoading();
                appendMessage('エラー: ' + e.message, 'tutor-message');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
