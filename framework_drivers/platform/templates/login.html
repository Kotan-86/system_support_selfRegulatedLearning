{# 仕様: docs/spec/participant-login.md#1-ログインとログアウト #}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 0 auto; padding: 20px; }
    label { display: block; margin: 0.75rem 0 0.25rem; }
    input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 6px; }
    .login-error { border: 1px solid #c62828; background: #ffebee; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <h3>ログイン</h3>
  {% if failure_message %}
  <p class="login-error" role="alert">{{ failure_message }}</p>
  {% endif %}
  <form method="post" action="/login">
    <label for="participant_id">ID</label>
    <input id="participant_id" name="participant_id" type="text" autocomplete="username">
    <label for="password">パスワード</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <input type="hidden" name="next" value="{{ next_value }}">
    <p><button type="submit">ログイン</button></p>
  </form>
</body>
</html>
