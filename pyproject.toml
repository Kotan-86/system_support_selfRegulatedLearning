[project]
name = "system-support-selfregulated-learning"
version = "0.1.0"
description = "LLM tutor with conversation history (SQLite)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "gunicorn>=21.0",
    "google-genai>=1.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
markers = [
    "real_llm: tests that call Vertex AI (run with credentials, e.g. RUN_REAL_LLM_TESTS=1)",
]
